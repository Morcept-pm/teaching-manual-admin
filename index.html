<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台操作手冊 · 內容管理後台</title>
<style>
  :root {
    --bg: #FFFDF5; --surface: #FFFFFF; --border: #EDE8D8;
    --text-primary: #151C31; --text-secondary: #5A5F72; --text-muted: #A0A5B8;
    --yellow: #F8CB2A; --yellow-light: #FEF9EC; --yellow-deep: #E6B800;
    --navy: #151C31; --danger: #DC2626; --danger-light: #FEF2F2;
    --shadow-sm: 0 1px 4px rgba(21,28,49,.06); --shadow-md: 0 4px 20px rgba(21,28,49,.10);
    --radius: 10px; --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;
    background: var(--bg); color: var(--text-primary);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .header { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 24px; height: 54px; flex-shrink: 0; }
  .header-logo { width: 28px; height: 28px; background: var(--yellow); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; color: var(--navy); }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-sub { font-size: 12px; color: rgba(255,255,255,.4); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: rgba(255,255,255,.7); }
  .header-right button { background: rgba(255,255,255,.1); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
  .header-right button:hover { background: rgba(255,255,255,.18); }

  /* LOGIN */
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 32px 30px; width: 320px; }
  .login-card h1 { font-size: 16px; margin-bottom: 4px; }
  .login-card p { font-size: 12.5px; color: var(--text-muted); margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px 10px; font-size: 13px; font-family: inherit; color: var(--text-primary); outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(248,203,42,.15); }
  .btn { background: var(--navy); color: #fff; border: none; border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn:hover { opacity: .88; }
  .btn.primary { background: var(--yellow); color: var(--navy); }
  .btn.danger { background: var(--danger-light); color: var(--danger); }
  .btn.ghost { background: #EEF0F5; color: var(--text-secondary); }
  .btn.full { width: 100%; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .error-msg { color: var(--danger); font-size: 12px; margin-top: 10px; display: none; }

  /* LAYOUT */
  .layout { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 300px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .search-wrap { padding: 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
  .search-wrap input { flex: 1; }
  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 6px 0 16px; }
  .sec-label { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .7px; color: var(--text-muted); text-transform: uppercase; }
  .sec-label button { font-size: 11px; background: none; border: none; color: var(--navy); cursor: pointer; font-weight: 700; }
  .s-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; border-left: 3px solid transparent; font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
  .s-item:hover { background: var(--yellow-light); color: var(--text-primary); }
  .s-item.active { background: var(--yellow-light); border-left-color: var(--yellow); color: var(--navy); font-weight: 600; }
  .qa-group-header { padding: 8px 12px; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
  .qa-sub .s-item { padding-left: 24px; font-size: 12.5px; }

  .content { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .empty-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); gap: 8px; }
  .empty-panel .ico { font-size: 34px; opacity: .5; }

  .panel-card { max-width: 720px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .panel-head h2 { font-size: 16px; }
  .panel-head .actions { display: flex; gap: 8px; }
  .status-msg { font-size: 12.5px; margin-bottom: 12px; padding: 8px 12px; border-radius: 6px; display: none; }
  .status-msg.show { display: block; }
  .status-msg.ok { background: #F0FDF4; color: #166534; }
  .status-msg.err { background: var(--danger-light); color: var(--danger); }

  .card-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
  .card-block h3 { font-size: 12.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }

  .plans-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .plans-row label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 400; }

  .dyn-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  .dyn-row input, .dyn-row textarea { flex: 1; }
  .dyn-row .rm-btn { flex-shrink: 0; background: var(--danger-light); color: var(--danger); border: none; border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-size: 14px; }
  .add-row-btn { font-size: 12.5px; color: var(--navy); background: none; border: 1px dashed var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; width: 100%; margin-top: 4px; }
  .add-row-btn:hover { background: var(--yellow-light); }

  .inner-qa-row { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .inner-qa-row .dyn-row:last-child { margin-bottom: 0; }
  .related-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
  .related-row select { width: 90px; flex-shrink: 0; }
  .related-row input.tid { width: 80px; flex-shrink: 0; }

  .img-preview { width: 100%; max-width: 320px; border-radius: 8px; border: 1px solid var(--border); display: block; margin-bottom: 10px; }
  .upload-row { display: flex; align-items: center; gap: 10px; }
  .upload-row input[type=file] { font-size: 12px; }
  .hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

  /* Rich text editor (解決方式) */
  .rte-wrap { border: 1.5px solid var(--border); border-radius: var(--radius-sm); }
  .rte-wrap:focus-within { border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(248,203,42,.15); }
  .rte-toolbar { display: flex; align-items: center; gap: 4px; padding: 5px 6px; background: #FAFAF7; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .rte-toolbar button { border: 1px solid transparent; background: none; border-radius: 4px; width: 26px; height: 26px; cursor: pointer; font-size: 13px; color: var(--text-secondary); }
  .rte-toolbar button:hover { background: var(--yellow-light); border-color: var(--border); }
  .rte-toolbar .rte-color { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border); cursor: pointer; padding: 0; }
  .rte-toolbar .rte-sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }
  .rte-editor { min-height: 110px; max-height: 340px; overflow-y: auto; padding: 8px 10px; font-size: 13px; font-family: inherit; color: var(--text-primary); line-height: 1.6; }
  .rte-editor:focus { outline: none; }
  .rte-editor p { margin: 0 0 8px; }
  .rte-editor p:last-child { margin-bottom: 0; }
  .rte-editor:empty:before { content: attr(data-placeholder); color: var(--text-muted); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-logo">默</div>
  <div class="header-title">內容管理後台</div>
  <div class="header-sub">後台操作手冊 · 默聲創意</div>
  <div class="header-right hidden" id="headerUserRow">
    <span id="userEmail"></span>
    <button onclick="doLogout()">登出</button>
  </div>
</div>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>登入後台</h1>
    <p>請使用 Morcept 內部帳號登入</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@morcept.com">
    </div>
    <div class="field">
      <label>密碼</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="btn primary full" onclick="doLogin()">登入</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- MAIN APP -->
<div class="layout hidden" id="appLayout">
  <div class="sidebar">
    <div class="search-wrap">
      <input type="text" id="searchBox" placeholder="搜尋問題...">
    </div>
    <div class="sidebar-scroll">
      <div class="sec-label">📖 圖文教學</div>
      <div id="guideList"></div>

      <div class="sec-label">❓ 常見問題 <button onclick="newArticle()">＋ 新增</button></div>
      <div id="articleList"></div>
    </div>
  </div>

  <div class="content">
    <div class="empty-panel" id="emptyPanel">
      <div class="ico">✏️</div>
      <div>從左側選擇項目開始編輯</div>
    </div>
    <div id="editPanel"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let GUIDES = [];
let ARTICLES = [];
let META = { planLabels: {A:"單頁式形象網站",B:"多頁式形象網站",C:"型錄式企業網站",D:"型錄企業網站(多語)",E:"購物網站"}, allPlans: ["A","B","C","D","E"], catIcons: {}, videoRelatedQA: {} };
let currentType = null; // 'guide' | 'article'
let currentId = null;
let pendingImageFile = null;

// ── Auth ──
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginWrap').classList.add('hidden');
    document.getElementById('appLayout').classList.remove('hidden');
    document.getElementById('headerUserRow').classList.remove('hidden');
    document.getElementById('userEmail').textContent = user.email;
    loadAll();
  } else {
    document.getElementById('loginWrap').classList.remove('hidden');
    document.getElementById('appLayout').classList.add('hidden');
    document.getElementById('headerUserRow').classList.add('hidden');
  }
});

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  auth.signInWithEmailAndPassword(email, pw).catch(err => {
    errEl.textContent = '登入失敗：帳號或密碼錯誤（' + err.code + '）';
    errEl.style.display = 'block';
  });
}
function doLogout() { auth.signOut(); }

// ── 使用行為記錄（給 AI 工具中心儀表板讀取，見 firestore.rules 的 tool_events）──
function getSessionId() {
  let sid = sessionStorage.getItem('tm_admin_session_id');
  if (!sid) {
    sid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
    sessionStorage.setItem('tm_admin_session_id', sid);
  }
  return sid;
}
function logToolEvent(type, target) {
  db.collection('tool_events').add({
    source: 'admin-site',
    type: type,
    target: String(target).slice(0, 280),
    session_id: getSessionId(),
    user: auth.currentUser ? auth.currentUser.email : null,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err => console.error('logToolEvent failed', err));
}

// ── Load data ──
async function loadAll() {
  const [guidesSnap, articlesSnap, metaSnap] = await Promise.all([
    db.collection('guides').orderBy('order').get(),
    db.collection('articles').orderBy('id').get(),
    db.collection('meta').doc('config').get()
  ]);
  GUIDES = guidesSnap.docs.map(d => ({ _docId: d.id, ...d.data() }));
  ARTICLES = articlesSnap.docs.map(d => ({ _docId: d.id, ...d.data() }));
  if (metaSnap.exists) META = { ...META, ...metaSnap.data() };
  renderSidebar();
}

function renderSidebar() {
  const guideListEl = document.getElementById('guideList');
  guideListEl.innerHTML = '';
  GUIDES.forEach(g => {
    const el = document.createElement('div');
    el.className = 's-item' + (currentType==='guide' && currentId===g._docId ? ' active' : '');
    el.innerHTML = `<span>${g.icon||'📄'}</span>${g.title}`;
    el.onclick = () => openGuide(g._docId);
    guideListEl.appendChild(el);
  });

  const articleListEl = document.getElementById('articleList');
  articleListEl.innerHTML = '';
  const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  const filtered = q
    ? ARTICLES.filter(a => a.q.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q))
    : ARTICLES;
  const cats = [...new Set(filtered.map(a => a.cat))];
  cats.forEach(cat => {
    const header = document.createElement('div');
    header.className = 'qa-group-header';
    header.textContent = cat;
    articleListEl.appendChild(header);
    filtered.filter(a => a.cat === cat).forEach(a => {
      const el = document.createElement('div');
      el.className = 's-item qa-sub' + (currentType==='article' && currentId===a._docId ? ' active' : '');
      el.textContent = a.q;
      el.onclick = () => openArticle(a._docId);
      articleListEl.appendChild(el);
    });
  });
}
document.getElementById('searchBox').addEventListener('input', renderSidebar);

function showStatus(msg, ok) {
  const el = document.getElementById('statusMsg');
  if (!el) return;
  el.textContent = msg;
  el.className = 'status-msg show ' + (ok ? 'ok' : 'err');
  setTimeout(() => el.classList.remove('show'), 3500);
}

// ══════════════ GUIDE EDIT ══════════════
function openGuide(docId) {
  currentType = 'guide'; currentId = docId; pendingImageFile = null;
  renderSidebar();
  const g = GUIDES.find(x => x._docId === docId);
  document.getElementById('emptyPanel').classList.add('hidden');

  const stepsRows = (g.steps || []).map(s => dynRowHtml('step', s)).join('');
  const innerQARows = (g.innerQAs || []).map(qa => innerQaRowHtml(qa.q, qa.a)).join('');
  const relatedRows = (g.related || []).map(r => relatedRowHtml(r)).join('');

  document.getElementById('editPanel').innerHTML = `
    <div class="panel-card">
      <div class="panel-head">
        <h2>${g.icon||'📄'} ${g.title}（圖文教學）</h2>
        <div class="actions">
          <button class="btn primary" onclick="saveGuide()">儲存變更</button>
        </div>
      </div>
      <div class="status-msg" id="statusMsg"></div>

      <div class="card-block">
        <h3>基本資訊</h3>
        <div class="field"><label>圖示 Emoji</label><input id="f-icon" value="${escAttr(g.icon)}"></div>
        <div class="field"><label>標題</label><input id="f-title" value="${escAttr(g.title)}"></div>
        <div class="field"><label>副標題</label><input id="f-subtitle" value="${escAttr(g.subtitle||'圖文教學')}"></div>
      </div>

      <div class="card-block">
        <h3>教學截圖</h3>
        ${g.image ? `<img class="img-preview" id="imgPreview" src="${g.image}">` : `<div class="hint" id="imgPreview">目前尚未設定圖片</div>`}
        <div class="upload-row">
          <input type="file" id="f-imagefile" accept="image/*" onchange="onImagePick(event)">
        </div>
        <div class="hint">建議尺寸與原教學截圖相近，上傳後需按「儲存變更」才會生效</div>
        <div class="field" style="margin-top:12px;"><label>圖片說明文字（📌 標註）</label><input id="f-caption" value="${escAttr(g.caption||'')}"></div>
      </div>

      <div class="card-block">
        <h3>操作步驟</h3>
        <div id="stepsRows">${stepsRows}</div>
        <button class="add-row-btn" onclick="addDynRow('stepsRows','step','')">＋ 新增步驟</button>
      </div>

      <div class="card-block">
        <h3>提醒 / 小提醒</h3>
        <div class="field">${richEditorHtml('f-tip', g.tip||'', '輸入提醒內容，可分段落、加粗或標色')}</div>
      </div>

      <div class="card-block">
        <h3>常見的延伸問題</h3>
        <div id="innerQaRows">${innerQARows}</div>
        <button class="add-row-btn" onclick="addInnerQaRow()">＋ 新增延伸問題</button>
      </div>

      <div class="card-block">
        <h3>相關主題標籤</h3>
        <div class="hint" style="margin-bottom:8px;">類型選「常見問題」時，目標請填該問題的編號（可在左側常見問題清單點開查看）；類型選「圖文教學」時，目標請填 login / article / image / menu</div>
        <div id="relatedRows">${relatedRows}</div>
        <button class="add-row-btn" onclick="addRelatedRow()">＋ 新增相關主題</button>
      </div>
    </div>
  `;
}

function onImagePick(e) {
  const file = e.target.files[0];
  if (!file) return;
  pendingImageFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const el = document.getElementById('imgPreview');
    if (el.tagName === 'IMG') { el.src = ev.target.result; }
    else {
      const img = document.createElement('img');
      img.className = 'img-preview'; img.id = 'imgPreview'; img.src = ev.target.result;
      el.replaceWith(img);
    }
  };
  reader.readAsDataURL(file);
}

async function saveGuide() {
  const g = GUIDES.find(x => x._docId === currentId);
  try {
    let imageUrl = g.image || null;
    if (pendingImageFile) {
      showStatus('圖片上傳中…', true);
      const ref = storage.ref().child(`guides/${currentId}-${Date.now()}-${pendingImageFile.name}`);
      await ref.put(pendingImageFile);
      imageUrl = await ref.getDownloadURL();
    }

    const steps = collectDynRows('stepsRows');
    const innerQAs = collectInnerQaRows();
    const related = collectRelatedRows();
    const tip = sanitizeAnswerHtml(document.getElementById('f-tip').innerHTML.trim());

    const payload = {
      id: currentId,
      order: g.order,
      icon: document.getElementById('f-icon').value.trim(),
      title: document.getElementById('f-title').value.trim(),
      subtitle: document.getElementById('f-subtitle').value.trim(),
      image: imageUrl,
      caption: document.getElementById('f-caption').value.trim(),
      steps, tip,
      innerQAs, related
    };
    await db.collection('guides').doc(currentId).set(payload);
    Object.assign(g, payload);
    pendingImageFile = null;
    logToolEvent('edit_guide', currentId + ':' + payload.title);
    showStatus('已儲存，公開手冊網頁稍後會自動更新', true);
  } catch (err) {
    console.error(err);
    showStatus('儲存失敗：' + err.message, false);
  }
}

// ══════════════ ARTICLE EDIT ══════════════
function openArticle(docId) {
  currentType = 'article'; currentId = docId;
  renderSidebar();
  const a = ARTICLES.find(x => x._docId === docId);
  renderArticleForm(a, false);
}

function newArticle() {
  currentType = 'article'; currentId = null;
  renderSidebar();
  const blank = { cat: '', plans: [...META.allPlans], q: '', a: '', kw: [] };
  renderArticleForm(blank, true);
}

function renderArticleForm(a, isNew) {
  document.getElementById('emptyPanel').classList.add('hidden');
  const existingCats = [...new Set(ARTICLES.map(x => x.cat))];
  const plansChecks = META.allPlans.map(p => `
    <label><input type="checkbox" class="plan-chk" value="${p}" ${(a.plans||[]).includes(p) ? 'checked' : ''}> ${p} ${META.planLabels[p]||''}</label>
  `).join('');

  document.getElementById('editPanel').innerHTML = `
    <div class="panel-card">
      <div class="panel-head">
        <h2>${isNew ? '新增常見問題' : '編輯常見問題'}</h2>
        <div class="actions">
          ${isNew ? '' : '<button class="btn danger" onclick="deleteArticle()">刪除</button>'}
          <button class="btn primary" onclick="saveArticle(${isNew})">儲存變更</button>
        </div>
      </div>
      <div class="status-msg" id="statusMsg"></div>

      <div class="card-block">
        <div class="field">
          <label>分類</label>
          <input id="f-cat" list="catOptions" value="${escAttr(a.cat)}" placeholder="選擇既有分類，或輸入新分類名稱">
          <datalist id="catOptions">${existingCats.map(c => `<option value="${escAttr(c)}">`).join('')}</datalist>
        </div>
        <div class="field"><label>問題</label><input id="f-q" value="${escAttr(a.q)}"></div>
        <div class="field">
          <label>解決方式</label>
          ${richEditorHtml('f-a', a.a, '輸入解決方式，Enter 換段落，可加粗或標色')}
          <div class="hint">按 Enter 換新段落；選取文字後可加粗或標色</div>
        </div>
        <div class="field">
          <label>適用方案</label>
          <div class="plans-row">${plansChecks}</div>
        </div>
        <div class="field">
          <label>搜尋關鍵字（每行一個，客戶輸入這些字都能搜到這篇）</label>
          <textarea id="f-kw" rows="4">${(a.kw||[]).join('\n')}</textarea>
        </div>
      </div>
    </div>
  `;
}

async function saveArticle(isNew) {
  try {
    const cat = document.getElementById('f-cat').value.trim();
    const q = document.getElementById('f-q').value.trim();
    const ansEl = document.getElementById('f-a');
    const ans = sanitizeAnswerHtml(ansEl.innerHTML.trim());
    const ansPlain = ansEl.textContent.trim();
    const plans = [...document.querySelectorAll('.plan-chk:checked')].map(el => el.value);
    const kw = document.getElementById('f-kw').value.split('\n').map(s => s.trim()).filter(Boolean);

    if (!cat || !q || !ansPlain) { showStatus('分類、問題、解決方式為必填', false); return; }

    let id, docId;
    if (isNew) {
      const maxId = ARTICLES.reduce((m, x) => Math.max(m, x.id||0), 0);
      id = maxId + 1;
      docId = String(id);
    } else {
      const existing = ARTICLES.find(x => x._docId === currentId);
      id = existing.id;
      docId = currentId;
    }

    const payload = { id, cat, plans, q, a: ans, kw };
    await db.collection('articles').doc(docId).set(payload);

    if (isNew) {
      ARTICLES.push({ _docId: docId, ...payload });
      currentId = docId;
    } else {
      Object.assign(ARTICLES.find(x => x._docId === docId), payload);
    }
    renderSidebar();
    logToolEvent('edit_article', docId + ':' + q);
    showStatus('已儲存，公開手冊網頁稍後會自動更新', true);
  } catch (err) {
    console.error(err);
    showStatus('儲存失敗：' + err.message, false);
  }
}

async function deleteArticle() {
  if (!confirm('確定要刪除這則常見問題嗎？此動作無法復原。')) return;
  try {
    const deletedId = currentId;
    await db.collection('articles').doc(currentId).delete();
    ARTICLES = ARTICLES.filter(x => x._docId !== currentId);
    currentType = null; currentId = null;
    document.getElementById('editPanel').innerHTML = '';
    document.getElementById('emptyPanel').classList.remove('hidden');
    renderSidebar();
    logToolEvent('delete_article', deletedId);
  } catch (err) {
    alert('刪除失敗：' + err.message);
  }
}

// ══════════════ Utils ══════════════
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ── Rich text editor（解決方式／提醒／延伸問題回答共用）──
function richEditorHtml(id, raw, placeholder, extraClass) {
  return `<div class="rte-wrap">
    <div class="rte-toolbar" onmousedown="event.preventDefault()">
      <button type="button" title="粗體" onclick="rteExec('${id}','bold')"><b>B</b></button>
      <span class="rte-sep"></span>
      <button type="button" class="rte-color" style="background:#151C31" title="深藍（預設）" onclick="rteColor('${id}','#151C31')"></button>
      <button type="button" class="rte-color" style="background:#DC2626" title="紅色" onclick="rteColor('${id}','#DC2626')"></button>
      <button type="button" class="rte-color" style="background:#2563EB" title="藍色" onclick="rteColor('${id}','#2563EB')"></button>
      <button type="button" class="rte-color" style="background:#16A34A" title="綠色" onclick="rteColor('${id}','#16A34A')"></button>
      <button type="button" class="rte-color" style="background:#E6B800" title="黃色" onclick="rteColor('${id}','#E6B800')"></button>
      <span class="rte-sep"></span>
      <button type="button" title="清除格式" onclick="rteExec('${id}','removeFormat')">✕</button>
    </div>
    <div id="${id}" class="rte-editor ${extraClass||''}" contenteditable="true" onfocus="document.execCommand('defaultParagraphSeparator', false, 'p')" data-placeholder="${escAttr(placeholder||'')}">${answerToEditorHtml(raw)}</div>
  </div>`;
}
function rteExec(id, cmd) {
  document.getElementById(id).focus();
  // styleWithCSS 是整份文件共用的開關，rteColor() 開過之後若不關掉，
  // 這裡的 bold 會變成 style="font-weight:..."，被 sanitizeAnswerHtml 的顏色白名單濾掉而消失。
  document.execCommand('styleWithCSS', false, false);
  document.execCommand(cmd, false, null);
}
function rteColor(id, color) {
  document.getElementById(id).focus();
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('foreColor', false, color);
}
// 舊資料是純文字（\n 分行），還沒被存成 HTML 前，載入編輯器時先轉成段落，
// 這樣舊的常見問題一打開就能直接用新編輯器繼續編輯。
function answerToEditorHtml(raw) {
  const s = String(raw || '');
  if (/<[a-z][\s\S]*>/i.test(s)) return s;
  return s.split(/\n{2,}/).map(p => `<p>${escHtml(p).replace(/\n/g,'<br>')}</p>`).join('');
}
// 存檔前清掉 contenteditable 可能夾帶的雜訊標籤／屬性，只留段落、粗體、顏色。
const RTE_ALLOWED_TAGS = { P:1, BR:1, STRONG:1, B:1, EM:1, I:1, U:1, SPAN:1, DIV:1 };
const RTE_STRIP_ENTIRELY_TAGS = { SCRIPT:1, STYLE:1, IFRAME:1, OBJECT:1, EMBED:1, LINK:1, META:1 };
function sanitizeAnswerHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  (function clean(node) {
    [...node.childNodes].forEach(child => {
      if (child.nodeType === 1) {
        if (RTE_STRIP_ENTIRELY_TAGS[child.tagName]) {
          node.removeChild(child);
          return;
        }
        if (!RTE_ALLOWED_TAGS[child.tagName]) {
          while (child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          return;
        }
        [...child.attributes].forEach(attr => {
          if (attr.name === 'style') {
            const color = child.style.color;
            child.removeAttribute('style');
            if (color) child.style.color = color;
          } else {
            child.removeAttribute(attr.name);
          }
        });
        clean(child);
      } else if (child.nodeType !== 3) {
        node.removeChild(child);
      }
    });
  })(tmp);
  return tmp.innerHTML;
}
</script>

<!-- ═══ AI 工具中心：Google 登入（限 @morcept.com）＋使用紀錄（morceptaioverview 的 usage_logs）═══
     分頁一直開著也會記錄：打開時記一次，之後只要有操作（點擊、按鍵、切回這個分頁），每 20 分鐘再記一次。
     安全機制：這個網址還沒加進 morceptaioverview 的「授權網域」時，不顯示登入門檻、工具照常使用（只是不記錄），
     加好網域後自動生效。設定：TOOL_ID／TOOL_NAME。 -->
<script>
(function () {
  var TOOL_ID = 'teaching-manual-admin', TOOL_NAME = '維運-客戶教學（編輯版）';
  var HUB = { apiKey: 'AIzaSyBjlXKMeerSnNO6ASadsH_8N2sMSmGokJQ', authDomain: 'morceptaioverview.firebaseapp.com', projectId: 'morceptaioverview', storageBucket: 'morceptaioverview.firebasestorage.app', messagingSenderId: '536899294593', appId: '1:536899294593:web:37623fd934b9814a33c480' };
  var WINDOW_MS = 20 * 60 * 1000;

  function load(src) { return new Promise(function (ok, fail) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }); }
  // 沿用頁面已載入的 Firebase compat 版本；沒有就載入 10.13.2
  function ensureSdk() {
    var v = (window.firebase && firebase.SDK_VERSION) || '10.13.2', base = 'https://www.gstatic.com/firebasejs/' + v + '/';
    var p = window.firebase && firebase.initializeApp ? Promise.resolve() : load(base + 'firebase-app-compat.js');
    return p.then(function () { return firebase.auth ? null : load(base + 'firebase-auth-compat.js'); })
            .then(function () { return firebase.firestore ? null : load(base + 'firebase-firestore-compat.js'); });
  }
  function domainAllowed() {
    return fetch('https://www.googleapis.com/identitytoolkit/v3/relyingparty/getProjectConfig?key=' + HUB.apiKey)
      .then(function (r) { return r.json(); })
      .then(function (d) { return (d.authorizedDomains || []).indexOf(location.hostname) !== -1; })
      .catch(function () { return false; });
  }

  // 登入門檻畫面
  var gate = document.createElement('div');
  gate.id = 'aithGate';
  gate.setAttribute('style', 'position:fixed;inset:0;z-index:2147483000;background:rgba(20,21,29,.92);display:none;align-items:center;justify-content:center;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;');
  gate.innerHTML = '<div style="background:#1c1d29;border:1px solid #33344a;border-radius:14px;padding:32px 28px;max-width:340px;width:88%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);">' +
    '<div style="font-size:15px;font-weight:600;color:#e9e7f0;margin-bottom:6px;">請先登入</div>' +
    '<div style="font-size:12.5px;color:#9a9bb5;margin-bottom:18px;line-height:1.6;">這是默聲創意內部工具，限 @morcept.com 帳號使用</div>' +
    '<button id="aithSignInBtn" type="button" style="width:100%;padding:11px;border-radius:8px;border:none;background:#e8b64c;color:#14151d;font-weight:600;font-size:14px;cursor:pointer;">使用 Google 帳號登入</button>' +
    '<div id="aithGateError" style="font-size:12px;color:#e0955a;margin-top:12px;min-height:16px;"></div></div>';

  domainAllowed().then(function (ok) {
    if (!ok) { console.info('[AI 工具中心] ' + location.hostname + ' 尚未加入授權網域，暫不啟用登入與使用紀錄'); return; }
    return ensureSdk().then(start);
  }).catch(function (e) { console.warn('[AI 工具中心] 使用紀錄初始化失敗', e); });

  function start() {
    var app; try { app = firebase.app('hub'); } catch (e) { app = firebase.initializeApp(HUB, 'hub'); }
    var auth = app.auth(), db = app.firestore(), user = null, pending = false;
    var provider = new firebase.auth.GoogleAuthProvider(); provider.setCustomParameters({ hd: 'morcept.com' });
    document.body.appendChild(gate);
    var errEl = gate.querySelector('#aithGateError');

    function log(source) {
      if (!user || pending) return;
      var key = 'aith_last_use_' + TOOL_ID + '_' + user.email, last = 0;
      try { last = parseInt(localStorage.getItem(key) || '0', 10); } catch (e) {}
      if (Date.now() - last < WINDOW_MS) return;
      pending = true;
      db.collection('usage_logs').add({ tool_id: TOOL_ID, tool_name: TOOL_NAME, action: 'open', user: user.email, timestamp: firebase.firestore.FieldValue.serverTimestamp(), source: source })
        .then(function () { try { localStorage.setItem(key, String(Date.now())); } catch (e) {} })
        .catch(function (err) { console.warn('[AI 工具中心] usage_logs 寫入失敗', err.code || err); })
        .then(function () { pending = false; });
    }
    auth.onAuthStateChanged(function (u) {
      if (u && u.email && /@morcept\.com$/i.test(u.email)) {
        user = u; gate.style.display = 'none'; log('direct_open');
      } else if (u) {
        errEl.textContent = '請用 @morcept.com 帳號登入'; auth.signOut();
      } else { user = null; gate.style.display = 'flex'; }
    });
    // 分頁開著持續使用：點擊、按鍵、切回分頁都算（同一人 20 分鐘內只記一次）
    document.addEventListener('click', function (e) { if (!gate.contains(e.target)) log('active_use'); }, true);
    document.addEventListener('keydown', function () { log('active_use'); }, true);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') log('active_use'); });

    gate.querySelector('#aithSignInBtn').addEventListener('click', function () {
      errEl.textContent = '';
      auth.signInWithPopup(provider).then(function (res) {
        var tok = res.credential && res.credential.accessToken;
        if (tok && typeof window.hubOnGoogleToken === 'function') window.hubOnGoogleToken(tok); // 工具自己也有 Google 登入時一起登入
      }).catch(function (err) {
        if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') auth.signInWithRedirect(provider);
        else if (err.code !== 'auth/popup-closed-by-user') errEl.textContent = '登入失敗：' + err.message;
      });
    });
    // 工具自己的 Google 登入完成時呼叫，順便登入工具中心，不用再按一次
    window.hubUsageLinkGoogle = function (accessToken) {
      if (!accessToken || user) return;
      auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(null, accessToken)).catch(function (e) { console.warn('[AI 工具中心] 連結登入失敗', e.code || e); });
    };
  }
})();
</script>
